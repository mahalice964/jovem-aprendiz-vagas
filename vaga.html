<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Detalhes da vaga | Jovem+</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- CABEÇALHO -->

    <header class="header">

        <div class="container header-content">

            <a href="index.html" class="logo">
                Jovem<span>+</span>
            </a>

            <nav class="menu">

                <a href="index.html">
                    Início
                </a>

                <a href="index.html#vagas">
                    Vagas
                </a>

                <a href="index.html#dicas">
                    Dicas
                </a>

                <a href="index.html#sobre">
                    Sobre
                </a>

            </nav>

        </div>

    </header>


    <!-- CONTEÚDO DA VAGA -->

    <main class="pagina-vaga">

        <div class="container">

            <a href="index.html#vagas" class="voltar">
                ← Voltar para vagas
            </a>


            <!-- DETALHES DA VAGA -->

            <section id="detalhesVaga" class="detalhes-vaga">

                <p>
                    Carregando vaga...
                </p>

            </section>


            <!-- FORMULÁRIO DE CANDIDATURA -->

            <section
                id="formularioCandidatura"
                class="formulario-candidatura"
                style="display: none;"
            >

                <h2>
                    Quero me candidatar
                </h2>

                <p>
                    Preencha seus dados para enviar sua candidatura.
                </p>


                <form id="formCandidatura">


                    <!-- NOME -->

                    <div class="campo-formulario">

                        <label for="nome">
                            Nome completo
                        </label>

                        <input
                            type="text"
                            id="nome"
                            name="nome"
                            placeholder="Digite seu nome completo"
                            required
                        >

                    </div>


                    <!-- EMAIL -->

                    <div class="campo-formulario">

                        <label for="email">
                            E-mail
                        </label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Digite seu e-mail"
                            required
                        >

                    </div>


                    <!-- TELEFONE -->

                    <div class="campo-formulario">

                        <label for="telefone">
                            Telefone
                        </label>

                        <input
                            type="tel"
                            id="telefone"
                            name="telefone"
                            placeholder="Digite seu telefone"
                            required
                        >

                    </div>


                    <!-- ESCOLARIDADE -->

                    <div class="campo-formulario">

                        <label for="escolaridade">
                            Escolaridade
                        </label>

                        <select
                            id="escolaridade"
                            name="escolaridade"
                            required
                        >

                            <option value="">
                                Selecione uma opção
                            </option>

                            <option value="fundamental">
                                Ensino Fundamental
                            </option>

                            <option value="medio">
                                Ensino Médio
                            </option>

                            <option value="medio-cursando">
                                Ensino Médio - Cursando
                            </option>

                            <option value="tecnico">
                                Curso Técnico
                            </option>

                            <option value="superior">
                                Ensino Superior
                            </option>

                        </select>

                    </div>


                    <!-- MENSAGEM -->

                    <div class="campo-formulario">

                        <label for="mensagem">
                            Fale um pouco sobre você
                        </label>

                        <textarea
                            id="mensagem"
                            name="mensagem"
                            rows="5"
                            placeholder="Escreva uma breve apresentação..."
                            required
                        ></textarea>

                    </div>


                    <!-- BOTÃO -->

                    <button
                        type="submit"
                        class="botao-enviar"
                    >
                        Enviar candidatura
                    </button>


                    <!-- MENSAGEM DE SUCESSO -->

                    <div
                        id="mensagemSucesso"
                        class="mensagem-sucesso"
                        style="display: none;"
                    >

                        ✅ Candidatura enviada com sucesso!

                    </div>


                </form>

            </section>

        </div>

    </main>


    <!-- RODAPÉ -->

    <footer>

        <div class="container">

            <strong>
                Jovem+
            </strong>

            <p>
                Conectando jovens às primeiras oportunidades.
            </p>

            <small>
                Projeto desenvolvido para fins educacionais.
            </small>

        </div>

    </footer>


    <script src="vaga.js"></script>

</body>

</html>
